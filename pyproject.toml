[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-viz-utils"
version = "0.1.0"
description = "Shared lightweight scientific visualization and utility helpers"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yichen Guo" }]
keywords = ["scientific visualization", "matplotlib", "image analysis", "utilities"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "matplotlib>=3.5",
  "numpy>=1.21",
]

[project.optional-dependencies]
hdf5 = ["h5py>=3.8"]
video = ["imageio>=2.30", "imageio-ffmpeg>=0.5", "opencv-python>=4.8"]
notebook = ["ipykernel>=6", "notebook>=7"]
dev = ["pytest>=8", "build>=1.2", "twine>=5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sci_viz_utils*"]
